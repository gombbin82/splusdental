name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - uses: terraform-linters/setup-tflint@v4
      - name: fmt
        run: terraform fmt -check -recursive infra
      - name: validate + tflint each root module
        run: |
          set -euo pipefail
          for dir in $(find infra -name '*.tf' -not -path '*/.terraform/*' -not -path 'infra/modules/*' -exec dirname {} \; | sort -u); do
            echo "::group::$dir"
            terraform -chdir="$dir" init -backend=false -input=false
            terraform -chdir="$dir" validate
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/infra/.tflint.hcl" --init
            tflint --chdir="$dir" --config="$GITHUB_WORKSPACE/infra/.tflint.hcl"
            echo "::endgroup::"
          done
